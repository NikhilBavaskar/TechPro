<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting | TechPro Solutions</title>
  <script>
    (function () {
      const path = window.location.pathname;
      let slug = path.split('/').filter(Boolean).pop();
      if (slug && slug.endsWith('.html')) {
        slug = slug.replace('.html', '');
      }
      
      if (slug && !['admin', 'blog', 'index'].includes(slug)) {
        window.location.replace('/blog/post.html?post=' + encodeURIComponent(slug));
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body style="background:#F8FAFC;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#64748B;">
  <p>Connecting to field guide...</p>
</body>
</html>
