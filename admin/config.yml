backend:
  name: github
  repo: NikhilBavaskar/TechPro # Replace with your GitHub repo
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Field Guides & Blog"
    folder: "_posts"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "date", format: "MMM DD, YYYY" }
      - { label: "Category / Tag", name: "tag", widget: "select", options: ["Maintenance & AMC", "Surveillance", "Workstations", "Web Systems", "Hardware Diagnostics"] }
      - { label: "Read Time", name: "readTime", widget: "string", default: "4 min read" }
      - { label: "Featured Cover Image", name: "image", widget: "image", required: false }
      - { label: "Short Excerpt", name: "excerpt", widget: "text" }
      - { label: "Article Content", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Company Information"
        name: "site"
        file: "site.json"
        fields:
          - { label: "Company Name", name: "companyName", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "WhatsApp", name: "whatsapp", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
