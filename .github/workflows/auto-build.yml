name: Auto Build Blog Data & Sitemap

on:
  push:
    paths:
      - '_posts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Data
        run: node scripts/generate-data.js

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update posts.json and sitemap.xml [skip ci]" && git push)
