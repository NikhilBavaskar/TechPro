name: Deploy Master TechPro SEO & Static Routes

on:
  push:
    branches: [ main, master ]
    paths:
      - '_posts/**'
      - 'blog/post.html'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Master Build Engine
        run: node scripts/build-site.js

      - name: Commit and Push Static Pages & Sitemaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json sitemap.xml blog/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated build: Clean SEO routes, sitemap & metadata [skip ci]" && git push)