<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Knowledge Hub Guide | TechPro Akola</title>
  
  <!-- Tailwind CSS & Official Typography Plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  
  <!-- Client-side Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 70 70'%3E%3Crect width='70' height='70' rx='18' fill='%230b1120' stroke='%231e293b' stroke-width='2'/%3E%3Cpath d='M18 24h34M28 24v24' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M42 24v26M42 24c12 0 12 14 0 14' fill='none' stroke='%2338bdf8' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='56' cy='16' r='3.5' fill='%2300f2fe'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'Space Grotesk', monospace; }
    
    /* Clean Dark-Mode Table Styling */
    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      margin-bottom: 1.5rem;
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    .prose th {
      background-color: #0e1424;
      color: #38bdf8;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #1e293b;
      text-align: left;
    }
    .prose td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
      font-size: 0.875rem;
    }
    .prose tr:nth-child(even) { background-color: rgba(14, 20, 36, 0.4); }
    .prose tr:hover { background-color: rgba(30, 41, 59, 0.5); }
    .prose hr { border-color: #1e293b; margin: 2rem 0; }
  </style>
</head>
<body class="bg-[#070A11] text-slate-300 antialiased selection:bg-cyan-500 selection:text-black">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-[#070A11]/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../" class="text-white font-extrabold text-base sm:text-lg flex items-center gap-2 hover:opacity-90">
        <span class="text-cyan-400">TechPro</span>
        <span class="text-slate-400 font-normal">/</span>
        <span class="text-slate-200">Knowledge Hub</span>
      </a>
      <a href="../#calculator" class="text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition-colors">
        Book On-Site Audit
      </a>
    </div>
  </header>

  <!-- Article View -->
  <main class="max-w-3xl mx-auto px-4 py-12">
    <div class="flex items-center gap-3 text-xs font-mono text-cyan-400 mb-4">
      <span id="postTag" class="uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-cyan-950/60 border border-cyan-800/40">Field Guide</span>
      <span>•</span>
      <span id="postDate" class="text-slate-400"></span>
      <span>•</span>
      <span id="postReadTime" class="text-slate-400"></span>
    </div>

    <h1 id="postHeading" class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-white leading-tight mb-8">
      Loading Article...
    </h1>

    <!-- Formatted Markdown Render Target -->
    <article id="postContent" class="prose prose-invert prose-cyan max-w-none text-slate-300 text-sm sm:text-base leading-relaxed">
      <p class="text-slate-500">Retrieving technical guide from repository...</p>
    </article>

    <!-- Support Callout Box -->
    <div class="mt-14 p-8 rounded-2xl bg-[#0E1424] border border-slate-800 text-center">
      <h3 class="text-xl font-bold text-white mb-2">Need On-Site Hardware Service in Akola?</h3>
      <p class="text-xs sm:text-sm text-slate-400 max-w-md mx-auto mb-6">
        TechPro technicians arrive within 2 to 4 hours across Civil Lines, Station Road, and MIDC.
      </p>
      <a href="https://wa.me/917972104370?text=Hi%20Nikhil,%20I%20read%20your%20hardware%20guide%20and%20need%20on-site%20support." 
         target="_blank"
         class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-xs tracking-wide shadow-lg hover:opacity-95 transition-all">
        Contact on WhatsApp &rarr;
      </a>
    </div>
  </main>

  <script>
    async function loadPostDetails() {
      const params = new URLSearchParams(window.location.search);
      const postSlug = params.get('post');

      try {
        const res = await fetch('../posts.json?t=' + Date.now());
        if (!res.ok) throw new Error('Cannot load posts.json');
        
        const data = await res.json();
        const postList = Array.isArray(data) ? data : (data.posts || []);
        
        const matchedPost = postList.find(p => p.id === postSlug) || postList[0];
        if (!matchedPost) throw new Error('Post not found');

        // Populate Metadata
        document.title = `${matchedPost.title} | TechPro Akola`;
        document.getElementById('postTag').innerText = matchedPost.tag || 'Field Guide';
        document.getElementById('postDate').innerText = matchedPost.date || '';
        document.getElementById('postReadTime').innerText = matchedPost.readTime || '4 min read';
        document.getElementById('postHeading').innerText = matchedPost.title;

        // Clean out escaping backslashes (e.g., \* -> *)
        let rawMarkdown = matchedPost.content || matchedPost.excerpt || '';
        let cleanMarkdown = rawMarkdown.replace(/\\([*_{}[\]()#+\-.!])/g, '$1');

        // Parse to HTML with marked.js
        document.getElementById('postContent').innerHTML = marked.parse(cleanMarkdown);

      } catch (e) {
        document.getElementById('postHeading').innerText = "Article Not Found";
        document.getElementById('postContent').innerHTML = `
          <p class="text-slate-400">This guide is unavailable or still synchronizing. 
          <a href="../" class="text-cyan-400 underline">Return to homepage</a>.</p>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', loadPostDetails);
  </script>
</body>
</html>
