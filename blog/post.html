<script>
    // Robust Frontmatter Parser (handles CRLF, extra dashes, and multiline excerpts)
    function extractPostContent(rawText) {
      let meta = {};
      let body = rawText;

      // Normalize line endings
      const normalized = rawText.replace(/\r\n/g, '\n');

      if (normalized.startsWith('---')) {
        const endIdx = normalized.indexOf('\n---', 3);
        if (endIdx !== -1) {
          const rawMeta = normalized.slice(3, endIdx).trim();
          body = normalized.slice(endIdx + 4).trim();

          rawMeta.split('\n').forEach(line => {
            const splitIdx = line.indexOf(':');
            if (splitIdx !== -1) {
              const key = line.slice(0, splitIdx).trim();
              let val = line.slice(splitIdx + 1).trim();
              if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.slice(1, -1);
              }
              meta[key] = val;
            }
          });
        }
      }
      return { meta, body };
    }

    async function loadPost() {
      const urlParams = new URLSearchParams(window.location.search);
      let slug = urlParams.get('post');

      if (!slug) {
        const path = window.location.pathname;
        if (path.includes('/blog/') && !path.endsWith('post.html')) {
          slug = path.split('/').filter(Boolean).pop().replace('.html', '');
        }
      }

      if (!slug) {
        document.getElementById('postTitle').innerText = 'Select a Field Guide';
        document.getElementById('postBody').innerHTML = '<p><a href="../#blog" class="text-blue-600 font-bold">&larr; Return to Knowledge Hub</a></p>';
        return;
      }

      try {
        // WhatsApp button integration
        fetch(`../site.json?t=${Date.now()}`).then(r => r.json()).then(site => {
          if (site && site.whatsapp) {
            document.getElementById('consultationWhatsAppBtn').href = 
              `https://wa.me/${site.whatsapp}?text=Hi,%20I%20have%20a%20question%20regarding:%20${encodeURIComponent(slug)}`;
          }
        }).catch(() => {});

        // 1. Fetch file directly from _posts/ folder
        const mdRes = await fetch(`../_posts/${slug}.md?t=${Date.now()}`).catch(() => null);

        if (mdRes && mdRes.ok) {
          const rawText = await mdRes.text();
          const { meta, body } = extractPostContent(rawText);

          // Populate Title & SEO
          const title = meta.title || slug;
          const seoTitle = meta.seoTitle || title;
          document.title = `${seoTitle} | TechPro Solutions`;
          document.getElementById('postMetaTitle').innerText = `${seoTitle} | TechPro Solutions`;
          document.getElementById('postTitle').innerText = title;

          if (meta.metaDesc || meta.excerpt) {
            document.getElementById('postMetaDesc').setAttribute('content', meta.metaDesc || meta.excerpt);
          }

          if (meta.tag) document.getElementById('postTagBadge').innerText = meta.tag;
          if (meta.date) document.getElementById('postDate').innerText = meta.date;
          if (meta.readTime) document.getElementById('postReadTime').innerText = meta.readTime;

          if (meta.image && meta.image.trim() !== '') {
            const imgEl = document.getElementById('postImage');
            imgEl.src = meta.image.startsWith('http') || meta.image.startsWith('../') ? meta.image : `../${meta.image}`;
            document.getElementById('postImageContainer').classList.remove('hidden');
          } else {
            document.getElementById('postImageContainer').classList.add('hidden');
          }

          // Parse and render Markdown Body
          if (body && body.trim().length > 0) {
            document.getElementById('postBody').innerHTML = marked.parse(body);
          } else {
            document.getElementById('postBody').innerHTML = marked.parse(meta.excerpt || 'Content is being updated.');
          }
          return;
        }

        // 2. Fallback: check posts.json
        const jsonRes = await fetch(`../posts.json?t=${Date.now()}`).catch(() => null);
        if (jsonRes && jsonRes.ok) {
          const pData = await jsonRes.json();
          const list = Array.isArray(pData) ? pData : (pData.posts || []);
          const post = list.find(p => p.id === slug || p.slug === slug);
          if (post) {
            document.title = `${post.title} | TechPro Solutions`;
            document.getElementById('postTitle').innerText = post.title;
            if (post.tag) document.getElementById('postTagBadge').innerText = post.tag;
            if (post.date) document.getElementById('postDate').innerText = post.date;
            if (post.readTime) document.getElementById('postReadTime').innerText = post.readTime;
            document.getElementById('postBody').innerHTML = marked.parse(post.body || post.excerpt || '');
            return;
          }
        }

        document.getElementById('postTitle').innerText = 'Guide Not Found';
        document.getElementById('postBody').innerHTML = '<p>The requested guide could not be located. <a href="../#blog" class="text-blue-600 font-bold">&larr; Return to Knowledge Hub</a></p>';
      } catch (err) {
        document.getElementById('postTitle').innerText = 'Error Loading Guide';
        document.getElementById('postBody').innerHTML = '<p>Please refresh the page or return to the main platform.</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadPost);
  </script>
