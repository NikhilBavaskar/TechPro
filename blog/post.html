    &copy; 2026 TechPro Solutions • Akola District
  </footer>

  <!-- Hydration Script -->
  <script>
    function parseFrontMatter(text) {
      let meta = {};
      let body = text;
      const normalized = text.replace(/\r\n/g, '\n');

      if (normalized.startsWith('---')) {
        const endIdx = normalized.indexOf('\n---', 3);
        if (endIdx !== -1) {
          const rawMeta = normalized.slice(3, endIdx).trim();
          body = normalized.slice(endIdx + 4).trim();

          rawMeta.split('\n').forEach(line => {
            const splitIdx = line.indexOf(':');
            if (splitIdx !== -1) {
              const key = line.slice(0, splitIdx).trim();
              let val = line.slice(splitIdx + 1).trim();
              if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.slice(1, -1);
              }
              meta[key] = val;
            }
          });
        }
      }
      return { meta, body };
    }

    async function loadPost() {
      const urlParams = new URLSearchParams(window.location.search);
      let rawParam = urlParams.get('post') || window.location.pathname.split('/').filter(Boolean).pop() || '';
      
      let slug = decodeURIComponent(rawParam)
        .replace(/^_posts\//, '')
        .replace(/^blog\//, '')
        .replace(/\.(html|md)$/, '')
        .trim();

      if (!slug || slug === 'post') {
        document.getElementById('postTitle').innerText = 'Field Guide Selection';
        document.getElementById('postBody').innerHTML = '<p><a href="../#blog" class="text-blue-600 font-bold">&larr; Return to Knowledge Hub</a></p>';
        return;
      }

      try {
        // Look up file in _posts directory
        let mdRes = await fetch(`../_posts/${slug}.md?t=${Date.now()}`).catch(() => null);

        // Prefix and long-filename fallback
        if (!mdRes || !mdRes.ok) {
          const candidates = [
            'multiple-hdd-nvr-ip-vs-analog-cameras-guide',
            'multi-hdd-storage-in-cp-plus-nvrs-and-ip-vs.-analog-cctv-the-complete-engineering-guide',
            'computer-amc-cctv-maintenance-akola',
            'computer-amc-cctv-maintenance-in-akola-stop-downtime-before-it-halts-your-operations'
          ];
          for (const cand of candidates) {
            if (cand.includes(slug) || slug.includes(cand.slice(0, 15))) {
              const testRes = await fetch(`../_posts/${cand}.md?t=${Date.now()}`).catch(() => null);
              if (testRes && testRes.ok) {
                mdRes = testRes;
                break;
              }
            }
          }
        }

        if (mdRes && mdRes.ok) {
          const rawText = await mdRes.text();
          const { meta, body } = parseFrontMatter(rawText);

          const title = meta.title || slug;
          document.title = (meta.seoTitle || title) + ' | TechPro';
          document.getElementById('postTitle').innerText = title;
          if (meta.tag) document.getElementById('postTagBadge').innerText = meta.tag;
          if (meta.date) document.getElementById('postDate').innerText = meta.date;
          if (meta.readTime) document.getElementById('postReadTime').innerText = meta.readTime;

          if (meta.image && meta.image.trim() !== '') {
            let imgPath = meta.image.trim().replace(/^\//, '');
            if (!imgPath.startsWith('http') && !imgPath.startsWith('../')) {
              imgPath = `../${imgPath}`;
            }
            const imgEl = document.getElementById('postImage');
            imgEl.src = imgPath;
            imgEl.onerror = () => { document.getElementById('postImageContainer').classList.add('hidden'); };
            document.getElementById('postImageContainer').classList.remove('hidden');
          }

          document.getElementById('postBody').innerHTML = marked.parse(body || meta.excerpt || '');
          return;
        }

        // Fallback: check posts.json
        const jsonRes = await fetch(`../posts.json?t=${Date.now()}`).catch(() => null);
        if (jsonRes && jsonRes.ok) {
          const list = await jsonRes.json();
          const post = (Array.isArray(list) ? list : (list.posts || [])).find(p => p.id === slug || p.slug === slug);
          if (post) {
            document.title = post.title + ' | TechPro';
            document.getElementById('postTitle').innerText = post.title;
            if (post.tag) document.getElementById('postTagBadge').innerText = post.tag;
            if (post.date) document.getElementById('postDate').innerText = post.date;
            if (post.readTime) document.getElementById('postReadTime').innerText = post.readTime;
            document.getElementById('postBody').innerHTML = marked.parse(post.body || post.excerpt || '');
            return;
          }
        }

        document.getElementById('postTitle').innerText = 'Guide Not Found';
        document.getElementById('postBody').innerHTML = '<p>The requested guide could not be located. <a href="../#blog" class="text-blue-600 font-bold">&larr; Return to Knowledge Hub</a></p>';
      } catch (e) {
        document.getElementById('postTitle').innerText = 'Error Loading Document';
        document.getElementById('postBody').innerHTML = '<p>Please refresh the page.</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadPost);
  </script>
